name: Build
on:
  push:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    steps:
    - name: Configure environment
      uses: actions/checkout@v7
    - name: Setup Flutter
      uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      with:
        path: '.fvmrc'
        cache-key: 'flutter-:os:-:version:'
        cache-path: '${{ runner.tool_cache }}/flutter/:os:-:version:'
    - name: Retrieve the secret and decode it to a file
      env:
        ENV_PROD_BASE64: ${{ secrets.ENV_PROD_BASE64 }}
      run: |
        mkdir .env
        echo $ENV_PROD_BASE64 | base64 -di > .env/prod.json
    - name: Setup project
      run: sh setup.sh
    - name: Verify formated files
      run: dart format . --set-exit-if-changed
    - name: Analyze code
      run: flutter analyze
    - name: Build web
      run: flutter build web --dart-define-from-file=.env/prod.json
    - uses: actions/upload-artifact@v7
      with:
        name: web-app
        path: build/web/
        retention-days: 1

  functions:
    name: Build functions
    runs-on: ubuntu-latest
    steps:
    - name: Configure environment
      uses: actions/checkout@v7
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json
    - name: Install functions dependencies
      run: npm --prefix functions ci
    - name: Build functions
      run: npm --prefix functions run build
    - name: Audit functions dependencies
      run: npm --prefix functions audit

  preview:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build, functions]
    name: Deploy preview web
    runs-on: ubuntu-latest
    steps:
    - name: Configure environment
      uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: web-app
        path: build/web
    - name: HTML/CSS/JS Minifier
      uses: docker://devatherock/minify-js:3.1.0
      with:
        directory: 'build/web'
        add_suffix: false
    - uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PELUQUERIA_MIMOS }}'
        projectId: peluqueria-mimos
        channelId: preview
  
  deployment:
    if: ${{ github.ref_type == 'tag' }}
    needs: [build, functions]
    name: Deploy web
    runs-on: ubuntu-latest
    steps:
    - name: Configure environment
      uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: web-app
        path: build/web
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json
    - name: Install functions dependencies
      run: npm --prefix functions ci
    - name: Deploy Cloud Functions
      uses: w9jds/firebase-action@v15.26.0
      with:
        args: deploy --only functions
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PELUQUERIA_MIMOS }}
        FIREBASE_PROJECT_ID: peluqueria-mimos
    - name: HTML/CSS/JS Minifier
      uses: docker://devatherock/minify-js:3.1.0
      with:
        directory: 'build/web'
        add_suffix: false
    - uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PELUQUERIA_MIMOS }}'
        projectId: peluqueria-mimos
        channelId: live
    - name: Release
      uses: softprops/action-gh-release@v2
